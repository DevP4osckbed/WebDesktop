<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Env VM</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #1a1a1a; overflow: hidden; 
            display: flex; align-items: center; justify-content: center; 
            font-family: sans-serif;
        }
        canvas { display: none; background: #000; }
        
        /* The Barebones Button */
        #vm-start-btn { 
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            letter-spacing: 2px;
            cursor: pointer;
            outline: none;
            padding: 20px;
        }
        #vm-start-btn:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <button id="vm-start-btn">START</button>
    <canvas id="desktop-canvas"></canvas>

    <script src="app.js" type="module"></script>
</body>
</html>
