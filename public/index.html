<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VM Launcher</title>
    <style>
        body {
            font-family: monospace;
            background-color: #111;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center; /* Center the VM on screen */
            margin: 0;
            padding: 20px;
        }

        /* The Container */
        #dev-area { 
            margin-top: 20px; 
            display: none; 
            border: 2px solid #555; 
            
            /* 16:9 Aspect Ratio Logic */
            width: 100%;
            max-width: 1280px; /* Limits size to 720p width */
            aspect-ratio: 16 / 9; 
            
            background: #000; 
            position: relative; /* Necessary for absolute positioning of iframe */
            overflow: hidden;
        }

        /* Ensure the iframe fills the 16:9 container perfectly */
        #dev-area iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* The VM Canvas */
        #desktop-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .controls {
            align-self: flex-start; 
            margin-bottom: 10px; /* Gives a little breathing room */
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="start-btn">Launch Environment</button>
        <div style="margin-top: 10px;">
            <input type="checkbox" id="dev-toggle"> <label for="dev-toggle">Dev Mode</label>
        </div>
    </div>

    <div id="dev-area"></div>

    <script src="app.js" type="module"></script>
</body>
</html>
