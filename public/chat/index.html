<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat</title>
    <style>
        body { font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; height: 90vh; }
        #chat { flex: 1; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Ollama something...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const socket = new WebSocket(`ws://${window.location.host}`);
        const chatDiv = document.getElementById('chat');
        const input = document.getElementById('userInput');

        socket.onmessage = (event) => {
            appendMessage('Ollama', event.data);
        };

        function sendMessage() {
            const text = input.value;
            if (!text) return;
            
            appendMessage('You', text);
            socket.send(text);
            input.value = '';
        }

        function appendMessage(sender, text) {
            const msg = document.createElement('p');
            msg.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatDiv.appendChild(msg);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        // Allow 'Enter' key to send
        input.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
